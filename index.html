<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мир Животных</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        h1 {
            color: #111;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        h2 {
            color: #222;
            margin-top: 30px;
        }
        p {
            color: #555;
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Животные</h1>
    
    <h2>Заголовок 1</h2>
    <p>Описание 1</p>
    <img src="animal1.webp" alt="" fetchpriority="high" width="500">
    
    <h2>Заголовок 2</h2>
    <p>Описание 2</p>
    <img src="animal2.webp" alt="" loading="lazy" width="500">
    
    <h2>Заголовок 3</h2>
    <p>Описание 3</p>
    <img src="animal3.webp" alt="" loading="lazy" width="500">
</body>
</html>
